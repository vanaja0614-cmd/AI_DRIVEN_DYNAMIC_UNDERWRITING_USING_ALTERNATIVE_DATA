services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trustflow
      POSTGRES_PASSWORD: trustflow_password
      POSTGRES_DB: trustflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustflow -d trustflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      APP_NAME: TrustFlow AI
      APP_VERSION: 1.0.0
      DEBUG: "True"
      DATABASE_URL: postgresql://trustflow:trustflow_password@db:5432/trustflow
      SECRET_KEY: trustflow-super-secret-key-change-this
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      RISK_MODEL_PATH: ml/models/risk_model.pkl
      FRAUD_MODEL_PATH: ml/models/fraud_model.pkl
      FIREBASE_DATABASE_URL: https://trustflow-5f98e-default-rtdb.firebaseio.com/
      FIREBASE_CREDENTIALS_PATH: /app/firebase-service-account.json
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
